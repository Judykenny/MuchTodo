name: Backend CI/CD

on:
  push:
    branches: [feature/full-stack]
    paths:
      - 'Server/**'
  pull_request:
    branches: [feature/full-stack]
    paths:
      - 'Server/**'

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: production-backend
  ASG_NAME: production-backend-asg
  ALB_DNS: production-alb-644936730.us-east-1.elb.amazonaws.com

jobs:
  test:
    name: Test and Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: Server/MuchToDo/go.sum

      - name: Download dependencies
        working-directory: Server/MuchToDo
        run: go mod download

      - name: Run go vet
        working-directory: Server/MuchToDo
        run: go vet ./... || true

      - name: Build binary
        working-directory: Server/MuchToDo
        run: go build ./cmd/api

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/feature/full-stack' && github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if not exists
        run: |
          aws ecr describe-repositories \
            --repository-names ${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }} 2>/dev/null || \
          aws ecr create-repository \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }}

      - name: Generate image tag
        id: meta
        run: |
          echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          docker build \
            --tag $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }} \
            --tag $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest \
            -f Server/MuchToDo/Dockerfile \
            Server/MuchToDo

      - name: Scan Docker image for vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --exit-code 0 \
            --severity HIGH,CRITICAL \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }}

      - name: Push Docker image to ECR
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }}
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

  deploy:
    name: Deploy to EC2 via Rolling Update
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/feature/full-stack' && github.event_name == 'push'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger rolling update
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ env.ASG_NAME }} \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 120}' \
            --region ${{ env.AWS_REGION }} \
            --query 'InstanceRefreshId' \
            --output text)
          echo "Instance refresh started: $REFRESH_ID"

      - name: Run smoke test
        run: |
          sleep 30
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://${{ env.ALB_DNS }}/health || echo "000")
          echo "Health check status: $HTTP_STATUS"

      - name: Deployment summary
        run: |
          echo "Backend deployed!"
          echo "ALB: http://${{ env.ALB_DNS }}"
