name: Frontend CI/CD

on:
  push:
    branches: [feature/full-stack]
    paths:
      - 'Client/**'
  pull_request:
    branches: [feature/full-stack]
    paths:
      - 'Client/**'

env:
  AWS_REGION: us-east-1
  S3_BUCKET: starttech-frontend-judykenny-2024
  CLOUDFRONT_DISTRIBUTION_ID: EYKD0NFCU6X4H

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: Client
        run: npm install

      - name: Run security audit
        working-directory: Client
        run: npm audit --audit-level=high || true

      - name: Lint check
        working-directory: Client
        run: npm run lint || true

      - name: Build production bundle
        working-directory: Client
        run: npm run build
        env:
          VITE_API_URL: http://production-alb-644936730.us-east-1.elb.amazonaws.com

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: Client/dist
          retention-days: 1

  deploy:
    name: Deploy to S3 and CloudFront
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/feature/full-stack' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: Client/dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync Client/dist s3://${{ env.S3_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "index.html"
          aws s3 cp Client/dist/index.html s3://${{ env.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "Invalidation ID: $INVALIDATION_ID"

      - name: Deployment summary
        run: |
          echo "Frontend deployed!"
          echo "URL: https://d7o1972s2ptl5.cloudfront.net"
